name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The repo only stores lib/, pubspec.yaml and android overrides.
      # Regenerate the native Android scaffold (incl. gradle wrapper), then
      # restore our sources on top of it.
      - name: Stash sources
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml _overrides /tmp/keep/

      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name niimbot_b1 --org dev.niimbot .

      - name: Restore sources
        run: |
          rm -rf lib pubspec.yaml
          cp -r /tmp/keep/lib ./lib
          cp /tmp/keep/pubspec.yaml ./pubspec.yaml
          cp /tmp/keep/_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk niimbot-b1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: niimbot-b1-apk
          path: niimbot-b1.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: niimbot-b1.apk
